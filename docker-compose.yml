services:
  mysql:
    image: mysql:8.0
    container_name: uniapp_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env (veja .env.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uniapp_db}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: uniapp-api:local
    container_name: uniapp_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-uniapp_db};Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env};"
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY no .env (veja .env.example)}
      Jwt__Issuer: ${JWT_ISSUER:-UniAppApi}
      Jwt__Audience: ${JWT_AUDIENCE:-UniAppMobile}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-http://localhost:5000}
    ports:
      - "${API_PORT:-5000}:8080"

volumes:
  mysql_data:
