version: '3.8'

services:
  mysql-uniapp:
    image: mysql:8.0
    container_name: uniapp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_uniapp_2026
      MYSQL_DATABASE: uniapp_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
